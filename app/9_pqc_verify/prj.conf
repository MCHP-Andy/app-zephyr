# Driver

# console
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096

#SHELL
CONFIG_SHELL=y
CONFIG_GPIO_SHELL=y
CONFIG_SHELL_PROMPT_UART="MCHP:~$ "

CONFIG_REBOOT=y

CONFIG_MAIN_STACK_SIZE=15360

CONFIG_WOLFSSL=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_WOLFSSL_MLDSA=y
CONFIG_COMPILER_OPT="-DWOLFSSL_SMALL_STACK -DWOLFSSL_MLDSA_VERIFY_NO_MALLOC -DWOLFSSL_MLDSA_VERIFY_SMALLEST_MEM"
